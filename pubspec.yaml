name: neighborlink
description: "NeighborLink - Gemeinsam. Lokal. Nachhaltig. A neighbourhood networking app built with Flutter and SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2

  # sqflite
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

  # --- Security: PBKDF2 password hashing
  crypto: ^3.0.6

  # --- Localised date & time formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
